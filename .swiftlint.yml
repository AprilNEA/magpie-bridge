# swift-format owns layout; SwiftLint checks correctness and maintainability.
included:
  - Magpie
  - MagpieTests
  - MagpieUITests
only_rules:
  - force_cast
  - force_try
  - unused_closure_parameter
  - unused_optional_binding
  - unused_setter_value
  - duplicate_imports
  - duplicate_enum_cases
  - empty_count
  - empty_string
  - fatal_error_message
  - large_tuple
  - legacy_constructor
  - return_arrow_whitespace
  - unneeded_break_in_switch
  - valid_ibinspectable
  - vertical_parameter_alignment
