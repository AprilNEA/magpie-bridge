name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select the Xcode version pinned in project.yml
        run: sudo xcode-select -s "/Applications/Xcode_$(yq '.options.xcodeVersion' project.yml).app"

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - run: make generate
      - run: make lint
      - run: make build
      - run: make test
